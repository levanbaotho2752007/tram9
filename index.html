<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
        <title>REPLY💥</title>
    </head>
    <body>
        <div class="app">
            <div class="toggle toggle__back">
                <a href="https://levanbaotho2752007.github.io/"><i class="fas fa-arrow-left"></i></a>
            </div>
            <div class="toggle toggle__theme">
                <i class="fas fa-moon"></i>
            </div>

            <div class="container">
                <div class="header__title">
                    <div class="header__title--img">
                        <img src="./logo.png" alt="Logo Reply">
                    </div>
                    <div class="header__title--name">
                        <h1>Team 9</h1>
                        <div class="veri__check">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                    <div class="header__title--description">
                        <p>Code by Btho</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card__item item-6">
                        <a href="javascript:void(0)" class="card__link js-modal-trigger" data-img="./ve.png">
                            <div class="link__icon">
                                <img src="./6.png" alt="Icon 6">
                            </div>
                        </a>
                    </div>

                    <div class="card__item item-5">
                        <a href="https://maps.app.goo.gl/2XAozBD6udnJEcSUA" target="_blank" class="card__link">
                            <div class="link__icon">
                                <img src="./5.png" alt="Icon 5">
                            </div>
                        </a>
                    </div>

                    <div class="card__item item-4">
                        <a href="javascript:void(0)" class="card__link js-modal-trigger" data-img="./sbr.png">
                            <div class="link__icon">
                                <img src="./4.png" alt="Icon 4">
                            </div>
                        </a>
                    </div>

                    <div class="card__item item-3">
                        <a href="https://maps.app.goo.gl/gfRq3Vkq9r6y3YbU8" target="_blank" class="card__link">
                            <div class="link__icon">
                                <img src="./3.png" alt="Icon 3">
                            </div>
                        </a>
                    </div>
                    
                    <div class="card__item item-2">
                        <a href="https://maps.app.goo.gl/pmpXBeN2WMaFQDuV8" target="_blank" class="card__link">
                            <div class="link__icon">
                                <img src="./2.png" alt="Icon 2">
                            </div>
                        </a>
                    </div>
                    
                    <div class="card__item item-1">
                        <a href="https://maps.app.goo.gl/28kAyaowWbwqdKWdA" target="_blank" class="card__link">
                            <div class="link__icon">
                                <img src="./1.png" alt="Icon 1">
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal" id="modal-popup">
            <span class="modal__close" id="modal-close">&times;</span>
            <img class="modal__content" id="modal-img" src="" alt="Ảnh chi tiết">
        </div>

        <script src="./script.js"></script>
    </body>
</html>
